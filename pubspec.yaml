name: nfc_ops
description: "NFC Ops - base Flutter para implementacao guiada por referencias"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  lucide_icons_flutter: ^3.1.20
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.1
  http: ^1.6.0
  nfc_manager: ^4.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  qr_code_dart_decoder: ^0.3.0
  image: ^4.10.1
  zxing_lib: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  qr: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700


